name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the Pages job widens its own token below.
permissions:
  contents: read

# Never run two production deploys at once, and never cancel one mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend → Render
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Fail here, not on Render, if the TypeScript doesn't compile.
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Trigger Render deploy hook
        id: hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Repository variable BACKEND_URL is not set"; exit 1
          fi
          response=$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          deploy_id=$(jq -r '.deploy.id // empty' <<<"$response")
          if [ -z "$deploy_id" ]; then
            echo "::error::Deploy hook did not return a deploy id"; exit 1
          fi
          echo "Render deploy started: $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.hook.outputs.deploy_id }}
        run: |
          for i in $(seq 1 90); do
            status=$(curl -fsS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "[$i/90] $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy ended with status '$status'"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out after 15 minutes waiting for Render"; exit 1

      - name: Smoke test /health
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "${BACKEND_URL%/}/health"

  frontend:
    name: Frontend → GitHub Pages
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          BASE_HREF: /${{ github.event.repository.name }}/
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=API_BASE_URL="${BACKEND_URL%/}/api"
          # Path URL strategy: let Pages serve the app for deep links on refresh.
          cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - id: deployment
        uses: actions/deploy-pages@v4
